    <div class = "container">
        <h2 class="page-header text-center">Numerical Summaries</h2>
    </div>
      
      <hr>
      
      <div class="container">
          <div class="row">
        <div class="col-8 col-md-8">
            <input id="values" type="text" class="form-control" placeholder="X Values (Separated by Commas)">
        </div>
        <div class="col-4 col-md-4">
            <select id="stat" class="form-control" onchange="stat()">
                <option value="choose">Choose</option>
                <option value="mean">Mean</option>
                <option value="median">Median</option>
                <option value="mode">Mode</option>
                <option value="percentiles">Percentiles</option>
                <option value="quartiles">Quartiles</option>
                <option value="range">Range</option>
                <option value="iqr">Inter Range</option>
                <option value="variance">Variance</option>
                <option value="stdev">St Dev</option>
                <option value="cv">Coeff of Var</option>
                <option value="zscores">z-Scores</option>
                <option value="covariance">Covariance</option>
                <option value="correlation">Corr Coeff</option>
            </select>
        </div> 
              </div>
        </div>
      
      <div class="container mt-2">
          <div class="slidecontainer">
            <input class="col-9" type="range" min="0" max="100" value="0" class="slider" id="myRange" onchange="calcper()">
            <p>Percentile: <span id="demo"></span></p>
        </div>
        </div>
          
          
         <div class="container mt-2"> 
        <div id="inputqu">
            <input type="text" style="display:none;" id="valqu">
            <select id="valquart" onchange="calcquart()">
                <option value="choose">Choose</option>
                <option value=25>First</option>
                <option value=50>Second</option>
                <option value=75>Third</option>
            </select>
        </div>
             </div>
        
      
      <div id="input2" class="container  mt-2">
          <div class="row">
        <div class="col-9">
            <input type="text" id="values2" class="form-control" placeholder="Y Values (Separated by Commas)">
        </div>
        
        <div class="col-3">
            <button id = "buttoncov" class="button" onclick="calccov()">Calculate</button>
            <button id = "buttoncor" class="button" onclick="calccor()">Calculate</button>
        </div> 
              </div>
    </div>
      
      <hr>
    
    
      <div class="container">
        <div id="output">
        </div>
      </div>
     
      
    <div style = "height: 400px"></div>
