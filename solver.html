<!DOCTYPE html>
<html>
   
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">
        <script src="jquery-3.5.0.min.js"></script>
    </head>
    <body>
        
        <div class="header">
            <a href="index.html" class="logo">Stats Solver</a>
            <div class="header-right">
                <a href="index.html">Home</a>
                <a href="solver.html">Solver</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
        
        <div id="input">
            <span>
                <input type="text" id="values" placeholder="Enter Values (separated by commas)">
            </span>
            <select id="stat" onchange="stat()">
                <option value="choose">Choose</option>
                <option value="mean">Mean</option>
                <option value="median">Median</option>
                <option value="mode">Mode</option>
                <option value="percentiles">Percentiles</option>
                <option value="quartiles">Quartiles</option>
                <option value="range">Range</option>
                <option value="iqr">Interquartile</option>
                <option value="variance">Variance</option>
                <option value="stdev">Standard</option>
                <option value="cv">Variation</option>
                <option value="zscores">Z-Scores</option>
                <option value="covariance">Covariance</option>
                <option value="correlation">Correlation</option>
            </select>
        </div>
        <div class="slidecontainer">
            <input type="range" min="0" max="100" value="0" class="slider" id="myRange" onchange="calcper()">
            <p>Percentile: <span id="demo"></span></p>
        </div>
        <div id="inputqu">
            <input type="text" style="display:none;" id="valqu">
            <select id="valquart" onchange="calcquart()">
                <option value="choose">Choose</option>
                <option value=25>First</option>
                <option value=50>Second</option>
                <option value=75>Third</option>
            </select>
        </div>
        <div id="input2">
            <input type="text" id="values2" placeholder="Enter Values (separated by commas)">
            <button class="button" onclick="calccov()">Calculate</button>
        </div>
        <div id="input3">
            <input type="text" id="values3" placeholder="Enter Values (separated by commas)">
            <button class="button" onclick="calccor()">Calculate</button>
        </div>
        <div id="output">
        </div>
        <script src="script.js"></script>
        <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script>window.MathJax = {
            loader: {load: ['[tex]/ams']},
            tex: {packages: {'[+]': ['ams']}}
        };
        </script>
        <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
                },
                svg: {
                fontCache: 'global'
                }
            };
        </script>
        <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    </body>
</html>
