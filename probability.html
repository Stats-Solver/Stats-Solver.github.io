<!DOCTYPE html>
<html>
   
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">
        <script src="jquery-3.5.0.min.js"></script>
        <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script>window.MathJax = {
            loader: {load: ['[tex]/ams']},
            tex: {packages: {'[+]': ['ams']}}
        };
        </script>
        <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
                },
                svg: {
                fontCache: 'global'
                }
            };
        </script>
    </head>
    <body>
        <div id="title">
            <p style="text-align:left;"><a href="index.html">
                <span style="font-size: 50px;">Stats Solver</span>
                </a>
                <span style="float:right; font-size: 30px;">
                    <button class="dropbtn"><a href="index.html">Home</a></button> &nbsp; &nbsp; &nbsp;
                    <span class="dropdown">
                            <button class="dropbtn">Solvers</button>
                            <span class="dropdown-content">
                                <a href="">Tables and Graphs</a>
                                <a href="numerical.html">Numerical Summaries</a>
                                <a href="probability.html">Probability Basics</a>
                                <a href="">Hypothesis Testing</a>
                                <a href="regression.html">Simple Regression</a>
                            </span>
                        </span> &nbsp; &nbsp; &nbsp;
                    <button class="dropbtn"><a href="contact.html">Contact</a></button>
                </span>
            </p>    
        </div>
        <div class="subtitle">
            <h2>Probability Basics</h2>
        </div>
        <div id="input">
            <select id="stat" onchange="stat()">
                <option value="choose">Choose</option>
                <option value="combinations">Combinations</option>
                <option value="permutations">Permutations</option>
                <option value="complement">Complement</option>
                <option value="union">Union</option>
                <option value="intersection">Intersection</option>
                <option value="conditional">Conditional</option>
            </select>
        </div>
        <div class="slidecontainer">
            <input type="range" min="0" max="100" value="0" class="slider" id="myRange" onchange="calcper()">
            <p>Percentile: <span id="demo"></span></p>
        </div>
        <div id="inputqu">
            <input type="text" style="display:none;" id="valqu">
            <select id="valquart" onchange="calcquart()">
                <option value="choose">Choose</option>
                <option value=25>First</option>
                <option value=50>Second</option>
                <option value=75>Third</option>
            </select>
        </div>
        <div id="input2">
            <input type="text" id="values2" placeholder="Example: 1, 2, 3, 4, 5">
            <button id = "buttoncov" class="button" onclick="calccov()">Calculate</button>
            <button id = "buttoncor" class="button" onclick="calccor()">Calculate</button>
        </div>
        <div id="output">
        </div>
        <script src="desscript.js"></script>
    </body>
</html>
