<!DOCTYPE html>
<html>
   
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">
        <script src="jquery-3.5.0.min.js"></script>
        <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script>window.MathJax = {
            loader: {load: ['[tex]/ams']},
            tex: {packages: {'[+]': ['ams']}}
        };
        </script>
        <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
                },
                svg: {
                fontCache: 'global'
                }
            };
        </script>
    </head>
    <body>
        <div id="title">
            <p style="text-align:left;"><a href="index.html">
                <span style="font-size: 50px;">Stats Solver</span>
                </a>
                <span style="float:right; font-size: 30px;">
                    <button class="dropbtn"><a href="index.html">Home</a></button> &nbsp; &nbsp; &nbsp;
                    <span class="dropdown">
                            <button class="dropbtn">Solvers</button>
                            <span class="dropdown-content">
                                <a href="numerical.html">Numerical Summaries</a>
                                <a href="hypothesis.html">Hypothesis Testing</a>
                                <a href="regression.html">Simple Regression</a>
                            </span>
                        </span> &nbsp; &nbsp; &nbsp;
                    <button class="dropbtn"><a href="contact.html">Contact</a></button>
                </span>
            </p>    
        </div>
        <div class="subtitle">
            <a href="regression.html"><h2>Simple Regression</h2></a>
        </div>
        <div id="input">
            <span style="display:inline-block">
                <label for=valuesx style="display:block">Enter Values (separated by commas)</label>
                <input type="text" id="valuesx" placeholder="Example: 1, 2, 3, 4, 5">
            </span>
        </div>
        <div id="input2">
            <span style="display:inline-block">
                <input type="text" id="valuesy" placeholder="Example: 1, 2, 3, 4, 5">
            </span>
            <select id="stat" onchange="stat()">
                <option value="choose">Choose</option>
                <option value="slope">Slope</option>
                <option value="intercept">Intercept</option>
                <option value="equation">Equation</option>
                <option value="sse">SSE</option>
                <option value="sst">SST</option>
                <option value="ssr">SSR</option>
                <option value="rsquared">r-Squared</option>
                <option value="correlation">Corr Coeff</option>
                <option value="mse">MSE</option>
                <option value="see">SEE</option>
                <option value="ses">SES</option>
                <option value="tstat">t-Statistic</option>
                <option value="msr">MSR</option>
                <option value="fstat">F-Statistic</option>
            </select>
        </div>
        <div id="output">
        </div>
        <script src="regscript.js"></script>
    </body>
</html>
