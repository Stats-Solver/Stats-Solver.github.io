    <div class = "container">
        <h2 class="page-header text-center">Simple Regression</h2>
    </div>
      
      <hr>
      
      <div class="container">
          <div class="row">
        <div class="col-12 col-md-8">
            <input type="text" id="valuesx" class="form-control" placeholder="X Values (separated by commas)">
        </div>
              </div>
    </div>
      
      <div class="container mt-2">
          <div class="row">
        <div class="col-12 col-md-8">
            <input type="text" id="valuesy" class="form-control" placeholder="Y Values (separated by commas)">
        </div>
        
        <div class="col-12 col-md-4">
            <select id="stat" class="form-control" onchange="stat()">
                <option value="choose">Choose</option>
                <option value="slope">Slope</option>
                <option value="intercept">Intercept</option>
                <option value="equation">Regression Equation</option>
                <option value="sse">Sum of Squares Error</option>
                <option value="sst">Sum of Squares Total</option>
                <option value="ssr">Sum of Squares Regression</option>
                <option value="rsquared">Coefficient of Determination</option>
                <option value="correlation">Correlation Coefficient</option>
                <option value="mse">Mean Square Error</option>
                <option value="see">Standard Error of Estimate</option>
                <option value="ses">Standard Error of Slope</option>
                <option value="tstat">t-Statistic</option>
                <option value="msr">Mean Square Regression</option>
                <option value="fstat">F-Statistic</option>
            </select>
        </div> 
              </div>
    </div>
      
    <hr>
      
      <div class="container">
        <div id="output">
        </div>
      </div>
