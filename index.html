<!DOCTYPE html>
<html>
   
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">
        <script src="jquery-3.5.0.min.js"></script>
        <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script>window.MathJax = {
            loader: {load: ['[tex]/ams']},
            tex: {packages: {'[+]': ['ams']}}
        };
        </script>
        <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
                },
                svg: {
                fontCache: 'global'
                }
            };
        </script>
    </head>
    <body>
        <div id="title">
            <h1>Stats Solver</h1>
        </div>
        <div id="input">
            <span style="display:inline-block">
                <label for=values style="display:block">Enter X Values (separated by commas)</label>
                <input type="text" id="values">
            </span>
            <select id="stat" onchange="stat()">
                <option value="choose">Choose</option>
                <option value="mean">Mean</option>
                <option value="median">Median</option>
                <option value="mode">Mode</option>
                <option value="percentiles">Percentiles</option>
                <option value="quartiles">Quartiles</option>
                <option value="range">Range</option>
                <option value="iqr">Interquartile</option>
                <option value="variance">Variance</option>
                <option value="stdev">Standard</option>
                <option value="cv">Variation</option>
                <option value="zscores">Z-Scores</option>
                <option value="covariance">Covariance</option>
                <option value="correlation">Correlation</option>
            </select>
        </div>
        <div id="label2">
            <label for=values style="display:block">Example: 1,2,3,4,5</label>
        </div>
        <div class="slidecontainer">
            <input type="range" min="0" max="100" value="0" class="slider" id="myRange" onchange="calcper()">
            <p>Percentile: <span id="demo"></span></p>
        </div>
        <div id="inputqu">
            <input type="text" style="display:none;" id="valqu">
            <select id="valquart" onchange="calcquart()">
                <option value="choose">Choose</option>
                <option value=25>First</option>
                <option value=50>Second</option>
                <option value=75>Third</option>
            </select>
        </div>
        <div id="input2">
            <label for=values2 style="display:block">Enter Y Values (separated by commas)</label>
            <input type="text" id="values2">
            <button class="button" onclick="calccov()">Calculate</button>
        </div>
        <div id="input3">
            <label for=values3 style="display:block">Enter Y Values (separated by commas)</label>
            <input type="text" id="values3">
            <button class="button" onclick="calccor()">Calculate</button>
        </div>
        <div id="output">
        </div>
        <script src="script.js"></script>
    </body>
</html>
